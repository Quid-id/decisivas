<!-- Barra da direita: voltar ao início e compartilhar. Os rótulos, os nomes e
     as cores de hover de cada rede vêm de configuracao.json (compartilhar); o
     endereço a compartilhar é o da própria página, lido no navegador, então
     não existe domínio escrito no build. A barra aparece quando o banner e a
     barra de menu saíram da tela, e some quando o rodapé começa a entrar. Em
     telas até 900 px ela vira uma faixa horizontal no pé, com o voltar à
     esquerda dos ícones. -->
<aside class="barra-lateral" id="barra-lateral" aria-label="{{ROTULO_COMPARTILHAR}}">
  <a class="botao-redondo voltar" href="{{DESTINO_VOLTAR}}" title="{{ROTULO_VOLTAR}}" aria-label="{{ROTULO_VOLTAR}}">{{ICONE_VOLTAR}}</a>
{{REDES}}
  <button type="button" class="botao-redondo" data-rede="copiar" id="copiar-link" data-confirmacao="{{CONFIRMACAO_COPIAR}}" style="--hover: {{COR_HOVER_COPIAR}}; --hover-icone: {{COR_ICONE_HOVER_COPIAR}}" title="{{NOME_COPIAR}}" aria-label="{{NOME_COPIAR}}">{{ROTULO_COPIAR}}</button>
</aside>
<script>
  (function () {
    var barra = document.getElementById("barra-lateral");
    var endereco = window.location.href.split("#")[0];
    var titulo = document.title.split(" · ")[0];
    var u = encodeURIComponent(endereco);
    var t = encodeURIComponent(titulo);
    var enderecos = {
      whatsapp: "https://api.whatsapp.com/send?text=" + t + "%20" + u,
      x: "https://twitter.com/intent/tweet?text=" + t + "&url=" + u,
      facebook: "https://www.facebook.com/sharer/sharer.php?u=" + u,
      linkedin: "https://www.linkedin.com/sharing/share-offsite/?url=" + u,
      bluesky: "https://bsky.app/intent/compose?text=" + t + "%20" + u,
    };
    barra.querySelectorAll("[data-rede]").forEach(function (a) {
      if (enderecos[a.dataset.rede]) a.href = enderecos[a.dataset.rede];
    });

    // A mesma folga nas duas pontas. O rodapé é procurado a cada medição, e
    // não uma vez só: este script vem ANTES do rodapé no HTML.
    var folga = 60;
    var alturaBarraDeMenu = 60;
    function posiciona() {
      var banner = document.getElementById("banner");
      var rodape = document.querySelector("footer");
      var altura = barra.offsetHeight;
      var vh = window.innerHeight;
      var fimDoBanner = banner ? banner.getBoundingClientRect().bottom : 0;
      var inicioDoRodape = rodape ? rodape.getBoundingClientRect().top : vh * 2;
      barra.classList.toggle("visivel", fimDoBanner + folga < 0 && inicioDoRodape - folga > vh);
      barra.style.top =
        window.innerWidth > 900 ? Math.max(vh / 2, alturaBarraDeMenu + 24 + altura / 2) + "px" : "";
    }
    window.addEventListener("scroll", posiciona, { passive: true });
    window.addEventListener("resize", posiciona);
    document.addEventListener("DOMContentLoaded", posiciona);
    posiciona();

    var copiar = document.getElementById("copiar-link");
    var rotuloCopiar = copiar.textContent;
    var confirmacao = copiar.dataset.confirmacao;
    copiar.addEventListener("click", function () {
      function pronto() {
        copiar.textContent = confirmacao;
        setTimeout(function () { copiar.textContent = rotuloCopiar; }, 1200);
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(endereco).then(pronto, function () {});
      } else {
        pronto();
      }
    });
  })();
</script>
