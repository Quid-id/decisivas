# DECISIVAS — configuração do Cloudflare Workers
# Serve o site estático de public/ e o Worker na rota /api/*.

name = "decisivas"
main = "src/worker.js"
compatibility_date = "2026-08-28"

# Build: monta o site em public/ a partir de brand/, paginas/, parciais/ e
# dados/ (docs/06, "O build, e o que ele gera"). Roda antes de `wrangler dev` e
# `wrangler deploy`, também no deploy por push.
[build]
command = "node scripts/sincroniza-tokens.js"
# Diretórios de origem: mudar um token, um parcial, uma tela, a configuração ou
# o conteúdo refaz o build no dev. `prompts/` saiu na etapa 8A.
watch_dir = ["brand", "paginas", "parciais", "dados", "conteudo", "assets"]

# Logs do Worker no painel (aba Logs). Declarado aqui porque o deploy
# sobrescreve a configuração feita pelo painel.
[observability]
enabled = true

# Site estático. run_worker_first garante que /api/* sempre passa pelo
# Worker (e portanto pela checagem de AGENT_ENABLED) antes dos assets, e que
# /admin passa pela conferência do crachá do Cloudflare Access antes de o
# arquivo ser entregue — o painel é da equipe, e essa é a segunda tranca, além
# da aplicação do Access na frente do caminho.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

# Banco D1 com o acervo etiquetado (schema em docs/02-schema.sql). Quem o
# consulta é a rota /api/explorar: os trechos do cruzamento, o cache de
# perguntas (tabela `consultas`, migração 005) e o registro.
[[d1_databases]]
binding = "DB"
database_name = "decisivas"
database_id = "adaab799-bffa-4f43-88eb-1cf9607e732c"

# Variáveis de ambiente NÃO secretas. Segredos (OPENROUTER_API_KEY etc.)
# nunca entram aqui: local em .dev.vars, produção no painel do Cloudflare.
[vars]
# Interruptor de desligamento. Governa uma coisa só: a rota /api/explorar, o
# "Explorar o acervo". As páginas são estáticas e não passam por ele.
AGENT_ENABLED = "true"

# O modelo do modo pergunta, fixo, sem roteamento. Ele não redige: recebe a
# pergunta e a lista de trechos do cruzamento e devolve só uma lista de
# números (prompts/explorar.txt).
MODEL_ID = "openai/gpt-5.6-sol"

# Painel de edição (etapa 9). Interruptor próprio: desligado, /admin e
# /api/cms/* respondem e não fazem nada, e o site segue de pé. Nada aqui é
# segredo — GITHUB_TOKEN e ACCESS_AUD vivem no painel do Cloudflare (local, em
# .dev.vars).
CMS_ENABLED = "true"

# Onde o painel grava: o repositório e o ramo que publica. É o mesmo repositório
# do deploy automático, e é por isso que salvar no painel publica o site.
CMS_REPO = "Quid-id/decisivas"
CMS_RAMO = "main"

# Saíram na etapa 8A, com a geração de página por modelo:
# CACHE_ENABLED         — as tabelas de cache saíram na migração 004; o cache
#                         de perguntas da etapa 10 é sempre ligado
# ACERVO_ATUALIZADO_EM  — a data que a página mostra é a da revisão do texto,
#                         que vem de conteudo/; a versão do acervo continua em
#                         dados/versao-acervo.txt
#
# SIMULAR_MODELO é instrumento de desenvolvimento e NÃO entra aqui: fica em
# .dev.vars, fora do versionamento. Com ele, a rota escolhe trechos por
# palavra, sem rede e sem chave, para exercitar o caminho inteiro.
#
# SIMULAR_ACESSO e SIMULAR_GITHUB são os equivalentes do painel, e valem a mesma
# regra: só em .dev.vars. O primeiro dispensa o crachá do Access e declara um
# e-mail; o segundo mantém a leitura real do repositório (que é público) e deixa
# a gravação na memória, para exercitar validação, mensagem de commit e
# histórico sem escrever de verdade e sem token.
