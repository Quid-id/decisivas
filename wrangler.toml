# DECISIVAS — configuração do Cloudflare Workers
# Serve o site estático de public/ e o Worker na rota /api/*.

name = "decisivas"
main = "src/worker.js"
compatibility_date = "2026-08-28"

# Build: monta o site em public/ a partir de brand/, paginas/, parciais/ e
# dados/ (docs/06, "O build, e o que ele gera"). Roda antes de `wrangler dev` e
# `wrangler deploy`, também no deploy por push.
[build]
command = "node scripts/sincroniza-tokens.js"
# Diretórios de origem: mudar um token, um parcial, uma tela, a configuração ou
# o conteúdo refaz o build no dev. `prompts/` saiu na etapa 8A.
watch_dir = ["brand", "paginas", "parciais", "dados", "conteudo", "assets"]

# Logs do Worker no painel (aba Logs). Declarado aqui porque o deploy
# sobrescreve a configuração feita pelo painel.
[observability]
enabled = true

# Site estático. run_worker_first garante que /api/* sempre passa pelo
# Worker (e portanto pela checagem de AGENT_ENABLED) antes dos assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Banco D1 com o acervo etiquetado (schema em docs/02-schema.sql). O Worker
# não consulta o banco nesta etapa: o binding fica para o "Explorar o acervo"
# (etapa 10), que é o único a voltar a lê-lo.
[[d1_databases]]
binding = "DB"
database_name = "decisivas"
database_id = "adaab799-bffa-4f43-88eb-1cf9607e732c"

# Variáveis de ambiente NÃO secretas. Segredos (OPENROUTER_API_KEY etc.)
# nunca entram aqui: local em .dev.vars, produção no painel do Cloudflare.
[vars]
# Interruptor de desligamento. Depois da etapa 8A ele governa uma coisa só: a
# rota /api/explorar, o "Explorar o acervo", que a 8B cria desligada. As
# páginas são estáticas e não passam por ele.
AGENT_ENABLED = "true"

# Saíram na etapa 8A, com a geração de página por modelo:
# MODEL_ID              — não há chamada a modelo em nenhuma rota; volta na 10
# CACHE_ENABLED         — as tabelas de cache saíram na migração 004
# ACERVO_ATUALIZADO_EM  — a data que a página mostra é a da revisão do texto,
#                         que vem de conteudo/; a versão do acervo continua em
#                         dados/versao-acervo.txt
