<!-- DECISIVAS — janela do vídeo de abertura do Início, retirada em 02/09/2026.
     O vídeo de apresentação passou a viver só na página Sobre, pelo campo
     video_embed de dados/configuracao.json: a janela atrapalhava a primeira
     escolha (público e tema) e o vídeo explica o projeto, que é assunto do
     Sobre. Guardado aqui como estava, marcação e estilo, se um dia voltar.

     Vinha do protótipo v5 e da especificação da etapa 8 ("Janela do vídeo na
     primeira visita, sem armazenamento local, botão Fechar e ver caminhos").
     Não é lido por nenhum script, build ou rota. -->

<div class="modal" id="janela-video">
  <div class="caixa">
    <div class="video" id="video">{{VIDEO}}</div>
    <div class="pe">
      <span>{{TEXTO_JANELA}}</span>
      <button type="button" id="fechar-video">{{BOTAO_JANELA}}</button>
    </div>
  </div>
</div>
<script>
  document.getElementById("fechar-video").addEventListener("click", function () {
    document.getElementById("janela-video").remove();
  });
</script>

}
</style>
