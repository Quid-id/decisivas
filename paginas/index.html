<!DOCTYPE html>
<html lang="pt-BR">
<head>
{{CABECA}}
<script src="/vocabulario.js"></script>
<script src="/configuracao.js"></script>
</head>
<body>
{{CABECALHO}}

<main><div class="larg">
  <h1 class="titulo-home" id="titulo-home"></h1>
  <p class="texto-home" id="texto-home"></p>
  <p class="pergunta" id="pergunta"></p>

  <div class="etapa">
    <h2 id="rotulo-publico"></h2>
    <div class="opcoes" id="publicos" role="group" aria-labelledby="rotulo-publico"></div>
  </div>

  <div class="etapa">
    <h2 id="rotulo-tema"></h2>
    <div class="opcoes" id="temas" role="group" aria-labelledby="rotulo-tema"></div>
  </div>

  <div class="acao">
    <button class="caminhos" id="btn-caminhos" disabled></button>
    <span class="escolha" id="escolha"></span>
  </div>
  <p class="chamada-home" id="chamada-home"></p>
</div></main>

{{RODAPE}}

<script>
  // Vocabulários fechados: /vocabulario.js, gerado no build a partir de
  // dados/vocabulario.json. Textos e rótulos: /configuracao.js, gerado de
  // dados/configuracao.json. Nada de texto de interface neste arquivo.
  const PUBLICOS = window.VOCABULARIO.publicos;
  const TEMAS = window.VOCABULARIO.macronarrativas;
  const HOME = window.CONFIGURACAO.home;

  const selecao = { publico: null, tema: null };

  function montaOpcoes(idGrupo, valores, chave) {
    const grupo = document.getElementById(idGrupo);
    for (const valor of valores) {
      const botao = document.createElement("button");
      botao.type = "button";
      // O banco guarda o identificador; a tela mostra o nome.
      botao.textContent = valor.nome;
      botao.dataset.id = valor.id;
      botao.setAttribute("aria-pressed", "false");
      // Pílula de tema não tem cor: a classe é o que o estilo usa para
      // distinguir as duas.
      if (!valor.cor) botao.className = "tema";
      if (valor.cor) {
        botao.style.setProperty("--cor", valor.cor);
        botao.style.setProperty("--cor-texto-pilula", valor.texto);
      }
      botao.addEventListener("click", () => {
        selecao[chave] = selecao[chave] === valor.id ? null : valor.id;
        for (const irma of grupo.children) {
          irma.setAttribute("aria-pressed", String(irma.dataset.id === selecao[chave]));
        }
        atualizaAcao();
      });
      grupo.appendChild(botao);
    }
  }

  function atualizaAcao() {
    const pronto = Boolean(selecao.publico && selecao.tema);
    document.getElementById("btn-caminhos").disabled = !pronto;
    const nomeDe = (lista, id) => (lista.find((v) => v.id === id) ?? {}).nome ?? "";
    document.getElementById("escolha").textContent = pronto
      ? `${nomeDe(PUBLICOS, selecao.publico)} · ${nomeDe(TEMAS, selecao.tema)}`
      : HOME.dica_vazia;
  }

  // O caminho é uma página estática, gerada no build a partir de conteudo/:
  // /caminhos/<slug do público>/<slug do tema>.
  document.getElementById("btn-caminhos").addEventListener("click", () => {
    const slugDe = (lista, id) => (lista.find((v) => v.id === id) ?? {}).slug;
    const publico = slugDe(PUBLICOS, selecao.publico);
    const tema = slugDe(TEMAS, selecao.tema);
    if (!publico || !tema) return;
    window.location.href = `/caminhos/${publico}/${tema}`;
  });

  document.getElementById("titulo-home").textContent = HOME.titulo;
  document.getElementById("texto-home").textContent = HOME.texto;
  document.getElementById("pergunta").textContent = HOME.pergunta;
  document.getElementById("rotulo-publico").textContent = HOME.rotulo_publico;
  document.getElementById("rotulo-tema").textContent = HOME.rotulo_tema;
  document.getElementById("btn-caminhos").textContent = HOME.botao;
  document.getElementById("chamada-home").textContent = HOME.chamada;

  montaOpcoes("publicos", PUBLICOS, "publico");
  montaOpcoes("temas", TEMAS, "tema");
  atualizaAcao();
</script>
</body>
</html>
