<!DOCTYPE html>
<html lang="pt-BR">
<head>
{{CABECA}}
<meta name="robots" content="noindex">
<script src="/vocabulario.js"></script>
<script src="/configuracao.js"></script>
</head>
<body>
{{CABECALHO}}

<main><div class="larg">
  <h1 class="titulo-home" id="titulo"></h1>
  <p class="texto-home" id="aviso"></p>
  <div class="acao"><a class="caminhos" id="botao" href="/"></a></div>
</div></main>

{{RODAPE}}

<script>
  // A rota antiga era /resultado?publico=...&tema=..., com a página gerada por
  // modelo. Os caminhos agora são estáticos, em /caminhos/<publico>/<tema>:
  // este redirecionamento mantém de pé qualquer link já compartilhado.
  (function () {
    var TEXTOS = window.CONFIGURACAO.redirecionamento;
    document.getElementById("titulo").textContent = TEXTOS.titulo;
    document.getElementById("aviso").textContent = TEXTOS.aviso;
    document.getElementById("botao").textContent = TEXTOS.botao;

    var p = new URLSearchParams(window.location.search);
    var slugDe = function (lista, id) {
      var achado = (lista || []).find(function (v) { return v.id === id; });
      return achado && achado.slug;
    };
    var publico = slugDe(window.VOCABULARIO.publicos, p.get("publico"));
    var tema = slugDe(window.VOCABULARIO.macronarrativas, p.get("tema"));
    if (publico && tema) {
      window.location.replace("/caminhos/" + publico + "/" + tema);
      return;
    }
    document.getElementById("aviso").textContent = TEXTOS.aviso_sem_parametros;
  })();
</script>
</body>
</html>
