<!DOCTYPE html>
<html lang="pt-BR">
<head>
{{CABECA}}
<script src="/configuracao.js"></script>
</head>
<body>
{{CABECALHO}}

<main class="caminho" style="{{ESTILO_PUBLICO}}"><div class="larg">

  <!-- Voltar ao início: fixo à esquerda do título, na altura das pílulas,
       visível desde o topo. Em telas até 900 px ele desaparece daqui e passa
       para a faixa horizontal do pé, na barra de compartilhamento. -->
{{VOLTAR}}

  <!-- 1. Cabeçalho: público, tema, data da revisão, título e linha -->
  <div class="cabecalho-caminho">
    {{PILULA_PUBLICO}}
    <span class="pilula tema">{{NOME_TEMA}}</span>
    <span class="meta">{{REVISADO_EM}}</span>
  </div>
  <h1 class="titulo-caminho">{{TITULO_CAMINHO}}</h1>
  <p class="linha-caminho">{{LINHA}}</p>

  <!-- O resumo abre a página como um menu em cascata, fechado (v8). -->
{{RESUMO_MENU}}

  <!-- Os blocos de conteúdo. Cada um é montado inteiro pelo build, com o
       rótulo de dados/configuracao.json: bloco sem nenhum item não é
       renderizado, e a página segue nos que existem. "O que funciona" e "o que
       não funciona" vêm como pilha de cards; "como chegar nele" entra da
       direita na rolagem. -->
{{BLOCO_POR_QUE}}
{{BLOCO_FUNCIONA}}
{{BLOCO_NAO_FUNCIONA}}
{{BLOCO_QUEM_E}}
{{BLOCO_COMO_CHEGAR}}

  <!-- 9. Explorar o acervo: parcial próprio, ligado (etapa 10) -->
{{EXPLORAR}}

</div></main>

{{COMPARTILHAR}}
{{INTERACAO}}
{{RODAPE}}
</body>
</html>
